<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1c">
<meta name="description" content="Audiobook interativo: Distribuição Eletrônica — o diagrama de Pauling. Prof. Amauri Junior.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icones/icone.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pauling">
<title>Distribuição Eletrônica</title>
<style>
/* ===================== FONTES (locais, funcionam offline) ===================== */
@font-face{font-family:"Space Grotesk";src:url(fontes/space-grotesk-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(fontes/space-grotesk-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url(fontes/space-grotesk-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fontes/ibm-plex-sans-300.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fontes/ibm-plex-sans-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fontes/ibm-plex-sans-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fontes/ibm-plex-sans-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fontes/ibm-plex-mono-500.woff2) format("woff2");font-weight:500;font-display:swap}

/* ===================== TEMA ===================== */
:root{
  --bg:#0a0e1c;
  --bg-2:#111733;
  --ink:#eef1ff;
  --ink-2:#a9b0d6;
  --ink-3:#6b739e;
  --line:rgba(170,180,255,.14);
  /* uma cor por subnível — usada em todo o app */
  --s:#3ee0ff;
  --p:#ff5fa8;
  --d:#ffc24a;
  --f:#8cff6a;
  --accent:#3ee0ff;
  --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.tela{
  position:fixed;inset:0;
  height:100dvh;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  transition:opacity .5s ease,visibility .5s;
  overflow:hidden;
}
.tela.ativa{opacity:1;visibility:visible}

/* fundo de "laboratório quântico" compartilhado */
.fundo{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60vmax 60vmax at 85% -10%,rgba(62,224,255,.16),transparent 60%),
    radial-gradient(55vmax 55vmax at -10% 110%,rgba(255,95,168,.14),transparent 60%),
    radial-gradient(40vmax 40vmax at 100% 100%,rgba(255,194,74,.08),transparent 60%),
    var(--bg);
}
.fundo::after{ /* grade fina */
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
  opacity:.45;
}

/* ===================== DIAGRAMA DE PAULING (SVG) ===================== */
.pauling text{font-family:"Space Grotesk",sans-serif;font-weight:600;fill:rgba(238,241,255,.28);transition:fill .35s,filter .35s}
.pauling text.camada{fill:rgba(238,241,255,.22);font-weight:700}
.pauling text.on{filter:drop-shadow(0 0 8px currentColor)}
.pauling text.on.s{fill:var(--s);color:var(--s)}
.pauling text.on.p{fill:var(--p);color:var(--p)}
.pauling text.on.d{fill:var(--d);color:var(--d)}
.pauling text.on.f{fill:var(--f);color:var(--f)}
.pauling .seta{stroke:rgba(238,241,255,.16);stroke-width:2;fill:none;stroke-linecap:round;transition:stroke .35s}
.pauling .seta.on{stroke:rgba(238,241,255,.7)}

/* ===================== CAPA ===================== */
#capa .pauling-capa{
  position:absolute;z-index:1;pointer-events:none;
  left:50%;bottom:2%;transform:translateX(-50%);
  width:min(96vw,560px);opacity:.32;
  mask-image:linear-gradient(to top,#000 40%,transparent 95%);
  -webkit-mask-image:linear-gradient(to top,#000 40%,transparent 95%);
}
.capa-conteudo{
  position:relative;z-index:2;
  flex:1;display:grid;
  grid-template-columns:1fr;
  align-content:center;justify-items:center;
  gap:clamp(14px,2.6vh,28px);
  padding:calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
  text-align:center;
}
.selo{
  display:inline-flex;align-items:center;gap:8px;
  font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);
  padding:8px 14px;border:1px solid var(--line);border-radius:999px;
  background:rgba(17,23,51,.6);backdrop-filter:blur(6px);
}
.selo i{width:7px;height:7px;border-radius:50%;background:var(--s);box-shadow:0 0 10px var(--s);animation:pisca 1.6s infinite}
@keyframes pisca{50%{opacity:.25}}

.titulo{
  font-family:"Space Grotesk",sans-serif;font-weight:700;
  font-size:clamp(34px,8.4vw,76px);line-height:.98;letter-spacing:-.02em;
}
.titulo span{
  display:block;
  background:linear-gradient(90deg,var(--s),var(--p) 45%,var(--d) 80%,var(--f));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitulo{
  margin-top:10px;
  font-size:clamp(15px,3.6vw,21px);color:var(--ink-2);font-weight:400;
}
.subtitulo b{color:var(--ink);font-weight:600}

/* foto com órbitas */
.atomo{
  --tam:clamp(150px,38vmin,290px);
  position:relative;width:var(--tam);height:var(--tam);
  display:grid;place-items:center;
}
.atomo .foto{
  width:72%;height:72%;border-radius:50%;
  overflow:hidden;position:relative;z-index:2;
  box-shadow:0 0 0 3px var(--bg),0 0 0 5px rgba(62,224,255,.6),0 0 40px rgba(62,224,255,.35);
}
.atomo .foto img{width:100%;height:100%;object-fit:cover;object-position:56% 16%;filter:saturate(1.05) contrast(1.03)}
.orbita{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(238,241,255,.18);
  animation:gira linear infinite;
}
.orbita.o1{transform:rotateX(68deg) rotateZ(0);animation-duration:7s;border-color:rgba(62,224,255,.45)}
.orbita.o2{inset:-6%;animation-duration:11s;border-color:rgba(255,95,168,.4)}
.orbita.o3{inset:-14%;animation-duration:16s;animation-direction:reverse;border-style:dashed;border-color:rgba(255,194,74,.3)}
.orbita::before{
  content:"";position:absolute;top:-6px;left:50%;
  width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:var(--c,var(--s));box-shadow:0 0 14px var(--c,var(--s)),0 0 4px #fff inset;
}
.orbita.o1{--c:var(--s)} .orbita.o2{--c:var(--p)} .orbita.o3{--c:var(--d)}
@keyframes gira{to{transform:rotate(360deg)}}
/* o1 é inclinada: gira dentro de um wrapper */
.orbita-incl{position:absolute;inset:-2%;transform:rotate(-28deg) scaleY(.38);z-index:3;pointer-events:none}
.orbita-incl .orbita{animation-duration:4.5s;border-color:rgba(62,224,255,.5)}
.orbita-incl .orbita::before{transform:scaleY(2.6)}

.credito{font-size:14px;color:var(--ink-2);letter-spacing:.02em}
.credito b{display:block;margin-top:2px;font-family:"Space Grotesk",sans-serif;font-size:19px;color:var(--ink);font-weight:600;letter-spacing:0}

.btn-iniciar{
  position:relative;
  display:inline-flex;align-items:center;gap:12px;
  padding:16px 34px;border-radius:999px;
  font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;
  color:#061018;
  background:linear-gradient(90deg,var(--s),#7cf0ff);
  box-shadow:0 10px 30px rgba(62,224,255,.35),0 0 0 0 rgba(62,224,255,.5);
  animation:pulso 2.4s infinite;
  transition:transform .15s;
}
.btn-iniciar:active{transform:scale(.96)}
.btn-iniciar svg{width:22px;height:22px}
@keyframes pulso{0%{box-shadow:0 10px 30px rgba(62,224,255,.35),0 0 0 0 rgba(62,224,255,.5)}70%{box-shadow:0 10px 30px rgba(62,224,255,.35),0 0 0 18px rgba(62,224,255,0)}100%{box-shadow:0 10px 30px rgba(62,224,255,.35),0 0 0 0 rgba(62,224,255,0)}}

/* landscape (tablet deitado / chromebook) */
@media (min-aspect-ratio:5/4) and (min-width:700px){
  .capa-conteudo{
    grid-template-columns:1.15fr .85fr;grid-template-areas:"texto atomo";
    text-align:left;justify-items:start;align-items:center;
    padding-left:clamp(32px,7vw,110px);padding-right:clamp(32px,6vw,90px);
    column-gap:5vw;
  }
  .capa-texto{grid-area:texto;display:grid;gap:22px;justify-items:start}
  .capa-atomo{grid-area:atomo;justify-self:center;display:grid;justify-items:center;gap:18px;text-align:center}
  .atomo{--tam:clamp(220px,40vmin,340px)}
  #capa .pauling-capa{left:auto;right:3%;bottom:auto;top:50%;transform:translateY(-50%);width:min(48vw,620px);opacity:.3;
    mask-image:radial-gradient(circle at center,transparent 26%,#000 46%);-webkit-mask-image:radial-gradient(circle at center,transparent 26%,#000 46%)}
}
@media (max-aspect-ratio:5/4), (max-width:699px){
  .capa-texto,.capa-atomo{display:contents}
  .capa-texto .btn-iniciar{order:10}
  .capa-atomo{order:5}
}
/* celular deitado (pouca altura) */
@media (max-height:480px) and (min-aspect-ratio:5/4){
  .capa-conteudo{grid-template-columns:1.2fr .8fr;text-align:left;justify-items:start;gap:12px;column-gap:4vw}
  .capa-texto{display:grid;gap:12px;justify-items:start}
  .capa-atomo{display:grid;justify-items:center;gap:8px;justify-self:center}
  .atomo{--tam:52vh}
  .titulo{font-size:clamp(28px,6vw,48px)}
}

/* ===================== PÁGINA DO AUDIOBOOK ===================== */
.topo{
  position:relative;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + var(--safe-t)) 16px 8px;
}
.topo-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.topo-info small{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.topo-info strong{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-home{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 12px;border-radius:14px;
  border:1px solid var(--line);background:rgba(17,23,51,.65);backdrop-filter:blur(8px);
  font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-2);
  transition:background .2s,color .2s;
}
.btn-home svg{width:22px;height:22px;color:var(--ink)}
.btn-home:hover{background:rgba(62,224,255,.12);color:var(--ink)}

/* palco: onde os eventos do áudio acontecem */
#palco{
  position:relative;z-index:2;flex:1;min-height:0;
  display:grid;place-items:center;
  padding:8px 16px;
}
#palco .pauling-palco{position:absolute;inset:6% 4%;width:92%;height:88%;opacity:.25;pointer-events:none}
.aguardando{
  position:relative;text-align:center;display:grid;gap:14px;justify-items:center;
  transition:opacity .5s,transform .5s;
}
.aguardando.some{opacity:0;transform:translateY(-10px);pointer-events:none}
.aguardando h2{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(26px,6vw,44px);line-height:1.05}
.aguardando p{color:var(--ink-2);font-size:clamp(14px,3.4vw,17px);max-width:30ch}
.aguardando .dica{
  display:inline-flex;align-items:center;gap:8px;margin-top:6px;
  font:500 12px "IBM Plex Mono",monospace;color:var(--s);letter-spacing:.08em;text-transform:uppercase;
}
.aguardando .dica svg{width:18px;height:18px;animation:aponta 1.4s ease-in-out infinite}
@keyframes aponta{50%{transform:translate(4px,4px)}}

/* equalizador quando está tocando */
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:14px;margin-left:8px;vertical-align:middle;opacity:0;transition:opacity .3s}
.tocando .eq{opacity:1}
.eq i{width:3px;background:var(--s);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s;background:var(--p)}
.eq i:nth-child(3){animation-delay:.4s;background:var(--d)}
.eq i:nth-child(4){animation-delay:.1s;background:var(--f)}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.pausado .eq i{animation-play-state:paused}

/* barra de base */
.base{
  position:relative;z-index:6;
  padding:0 16px calc(14px + var(--safe-b));
  display:flex;align-items:flex-end;justify-content:center;
}
.progresso{
  position:absolute;left:16px;right:16px;top:-14px;height:3px;border-radius:3px;
  background:rgba(238,241,255,.1);overflow:hidden;
}
.progresso i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--s),var(--p),var(--d),var(--f));transition:width .25s linear}
.btn-sumario{
  display:inline-flex;align-items:center;gap:10px;
  padding:12px 22px;border-radius:999px;
  border:1px solid var(--line);background:rgba(17,23,51,.8);backdrop-filter:blur(10px);
  font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:15px;letter-spacing:.04em;
  transition:background .2s;
}
.btn-sumario:hover{background:rgba(62,224,255,.12)}
.btn-sumario svg{width:18px;height:18px}

.btn-play{
  position:absolute;right:16px;bottom:calc(10px + var(--safe-b));
  width:66px;height:66px;border-radius:50%;
  display:grid;place-items:center;
  color:#061018;
  background:conic-gradient(from 0deg,var(--s),var(--p),var(--d),var(--f),var(--s));
  box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 26px rgba(62,224,255,.35);
  transition:transform .15s;
}
.btn-play::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#e9fbff}
.btn-play svg{position:relative;width:28px;height:28px}
.btn-play:active{transform:scale(.92)}
.btn-play .ic-pause{display:none}
.tocando .btn-play .ic-play{display:none}
.tocando .btn-play .ic-pause{display:block}
.tocando .btn-play{animation:giraborda 4s linear infinite}
.tocando .btn-play svg{animation:giraborda 4s linear infinite reverse}
@keyframes giraborda{to{transform:rotate(360deg)}}
.btn-play.chama{animation:pulsoPlay 2s infinite}
@keyframes pulsoPlay{0%,100%{box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 0 rgba(62,224,255,.6)}60%{box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 16px rgba(62,224,255,0)}}

/* ===================== SUMÁRIO (folha que sobe de baixo) ===================== */
.veu{
  position:fixed;inset:0;z-index:40;background:rgba(4,6,14,.6);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
}
.veu.aberto{opacity:1;visibility:visible}
.folha{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  margin:0 auto;max-width:640px;max-height:78dvh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#151c3d,#0e1430);
  border:1px solid var(--line);border-bottom:0;
  border-radius:24px 24px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.5);
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);
  padding-bottom:var(--safe-b);
}
.folha.aberta{transform:translateY(0)}
.folha-alca{width:44px;height:5px;border-radius:5px;background:rgba(238,241,255,.2);margin:10px auto 0}
.folha-topo{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;border-bottom:1px solid var(--line)}
.folha-topo h3{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:20px}
.folha-topo small{display:block;font:500 11px "IBM Plex Mono",monospace;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.btn-fechar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(238,241,255,.08);transition:background .2s}
.btn-fechar:hover{background:rgba(255,95,168,.2)}
.btn-fechar svg{width:20px;height:20px}
.lista{list-style:none;overflow-y:auto;padding:8px 10px 14px;-webkit-overflow-scrolling:touch}
.lista button{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  padding:12px 12px;border-radius:14px;transition:background .2s;
}
.lista button:hover{background:rgba(238,241,255,.06)}
.lista .num{
  flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:16px;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
}
.lista .txt{flex:1;min-width:0}
.lista .txt b{display:block;font-weight:600;font-size:15px}
.lista .txt span{font-size:13px;color:var(--ink-3)}
.lista .atual{background:rgba(62,224,255,.1)}
.lista .atual .txt span{color:var(--s)}

/* aviso flutuante */
.aviso{
  position:fixed;left:50%;top:calc(70px + var(--safe-t));z-index:60;
  transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  max-width:min(92vw,440px);
  padding:12px 16px;border-radius:14px;
  background:#1b2350;border:1px solid var(--line);color:var(--ink);font-size:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
  transition:opacity .3s,transform .3s;
}
.aviso.mostra{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ============================ CAPA ============================ -->
<section id="capa" class="tela ativa" aria-label="Capa">
  <div class="fundo"></div>
  <svg class="pauling pauling-capa" data-pauling aria-hidden="true"></svg>

  <div class="capa-conteudo">
    <div class="capa-texto">
      <span class="selo"><i></i>Audiobook interativo · Química</span>
      <div>
        <h1 class="titulo">Distribuição <span>Eletrônica</span></h1>
        <p class="subtitulo">Subtema: <b>O diagrama de Pauling</b></p>
      </div>
      <button class="btn-iniciar" id="btnIniciar">
        Iniciar
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="capa-atomo">
      <div class="atomo" aria-hidden="true">
        <div class="orbita o3"></div>
        <div class="orbita o2"></div>
        <div class="foto"><img src="imagens/amauri_jr.jpg" alt=""></div>
        <div class="orbita-incl"><div class="orbita o1"></div></div>
      </div>
      <p class="credito">desenvolvido por <b>Amauri Junior</b></p>
    </div>
  </div>
</section>

<!-- ======================= PÁGINA 1 DO AUDIOBOOK ======================= -->
<section id="pagina1" class="tela pausado" aria-label="Audiobook — página 1">
  <div class="fundo"></div>

  <header class="topo">
    <div class="topo-info">
      <small>Diagrama de Pauling</small>
      <strong><span id="capAtual">1 · Introdução</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></strong>
    </div>
    <button class="btn-home" id="btnHome" aria-label="Voltar para a capa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      Home
    </button>
  </header>

  <!-- PALCO: área onde os eventos dos diálogos vão acontecer -->
  <main id="palco">
    <svg class="pauling pauling-palco" data-pauling aria-hidden="true"></svg>
    <div class="aguardando" id="aguardando">
      <h2>Vamos começar?</h2>
      <p>Coloque o fone, aumente o volume e toque no play para ouvir a narração.</p>
      <span class="dica">toque no play
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 9v8H9"/></svg>
      </span>
    </div>
  </main>

  <footer class="base">
    <div class="progresso"><i id="barra"></i></div>
    <button class="btn-sumario" id="btnSumario" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
      Sumário
    </button>
    <button class="btn-play chama" id="btnPlay" aria-label="Tocar narração">
      <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
    </button>
  </footer>
</section>

<!-- ============================ SUMÁRIO ============================ -->
<div class="veu" id="veu"></div>
<div class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="tituloSumario">
  <div class="folha-alca"></div>
  <div class="folha-topo">
    <div><small>Diagrama de Pauling</small><h3 id="tituloSumario">Sumário</h3></div>
    <button class="btn-fechar" id="btnFechar" aria-label="Fechar sumário">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <ol class="lista" id="lista"></ol>
</div>

<div class="aviso" id="aviso" role="status"></div>

<audio id="narracao" preload="auto"></audio>

<script>
/* =====================================================================
   CONFIGURAÇÃO DO AUDIOBOOK  — edite aqui
   ---------------------------------------------------------------------
   CAPITULOS: itens do Sumário. Cada um aponta para um áudio da pasta
   audio/ (sem ".mp3") e um tempo de início em segundos.
   ===================================================================== */
const CAPITULOS = [
  { titulo: 'Introdução',                   audio: 'dialogo0', inicio: 0 },
  { titulo: 'Quem foi Linus Pauling',       audio: 'dialogo1', inicio: 0 },
  { titulo: 'Camadas e subníveis',          audio: 'dialogo2', inicio: 0 },
  { titulo: 'Montando o diagrama',          audio: 'dialogo3', inicio: 0 },
  { titulo: 'Seguindo as diagonais',        audio: 'dialogo4', inicio: 0 },
  { titulo: 'Praticando a distribuição',    audio: 'dialogo5', inicio: 0 },
];

/* Ordem em que os diálogos tocam, um após o outro, a cada toque no play */
const SEQUENCIA = ['dialogo0','dialogo1','dialogo2','dialogo3','dialogo4','dialogo5'];

/* EVENTOS: o que acontece durante cada diálogo.
   { t: segundos, acao: () => { ... } }  — dispara quando o áudio passa por t.
   Também existem os ganchos especiais 'inicio' e 'fim' por diálogo.        */
const EVENTOS = {
  dialogo0: [
    // { t: 2.5, acao: () => { ... } },
  ],
};

/* ===================================================================== */

const $ = s => document.querySelector(s);
const audio = $('#narracao');
const pagina = $('#pagina1');
const btnPlay = $('#btnPlay');
let indiceSeq = -1;          // qual diálogo da SEQUENCIA está carregado
let disparados = new Set();  // eventos já executados no diálogo atual
const sfx = nome => { try { const a = new Audio('audio/vfx/' + nome + '.mp3'); a.play().catch(()=>{}); } catch(e){} };

/* ---------- Diagrama de Pauling desenhado em SVG ---------- */
const LINHAS = [
  ['K',1,['s']],['L',2,['s','p']],['M',3,['s','p','d']],['N',4,['s','p','d','f']],
  ['O',5,['s','p','d','f']],['P',6,['s','p','d']],['Q',7,['s','p']]
];
const MAX = {s:2,p:6,d:10,f:14};
const L_NUM = {s:0,p:1,d:2,f:3};
// ordem energética (regra das diagonais)
const ORDEM = [];
for (let k = 1; k <= 9; k++)
  LINHAS.forEach(([,n,subs]) => subs.forEach(l => { if (n + L_NUM[l] === k) ORDEM.push(n + l); }));
// dentro de cada diagonal, n menor primeiro (já está), resultado:
// 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p

function desenhaPauling(svg){
  const W = 92, H = 56, X0 = 70, Y0 = 46;
  svg.setAttribute('viewBox','0 0 470 440');
  const pos = {};
  let html = '<defs><marker id="pt'+svg.dataset.id+'" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(238,241,255,.45)"/></marker></defs>';
  LINHAS.forEach(([letra,n,subs],i) => {
    const y = Y0 + i*H;
    html += `<text class="camada" x="18" y="${y}" font-size="26">${letra}</text>`;
    subs.forEach((l,j) => {
      const x = X0 + j*W;
      pos[n+l] = {x,y};
      html += `<text class="sub ${l}" data-sub="${n+l}" x="${x}" y="${y}" font-size="26">${n}${l}<tspan dy="-11" font-size="15">${MAX[l]}</tspan></text>`;
    });
  });
  // setas diagonais (de cima-direita para baixo-esquerda)
  for (let k = 1; k <= 9; k++){
    const grupo = ORDEM.filter(c => +c[0] + L_NUM[c[1]] === k);
    if (!grupo.length) continue;
    // grupo[0] = n menor (canto de cima à direita); último = n maior (embaixo à esquerda)
    const ini = pos[grupo[0]], fim = pos[grupo[grupo.length-1]];
    const x1 = ini.x + 58, y1 = ini.y - 26, x2 = fim.x - 18, y2 = fim.y + 14;
    html += `<line class="seta" data-k="${k}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#pt${svg.dataset.id})"/>`;
  }
  svg.innerHTML = html;
}
document.querySelectorAll('[data-pauling]').forEach((svg,i) => { svg.dataset.id = i; desenhaPauling(svg); });

/* animação: acende os subníveis na ordem do diagrama, em loop */
function animaPauling(svg){
  let i = 0, timer;
  const passo = () => {
    if (i === 0) svg.querySelectorAll('.on').forEach(e => e.classList.remove('on'));
    const sub = ORDEM[i];
    const k = +sub[0] + L_NUM[sub[1]];
    svg.querySelector(`[data-sub="${sub}"]`)?.classList.add('on');
    svg.querySelector(`.seta[data-k="${k}"]`)?.classList.add('on');
    i++;
    timer = setTimeout(passo, i >= ORDEM.length ? (i = 0, 2600) : 420);
  };
  passo();
}
document.querySelectorAll('[data-pauling]').forEach(animaPauling);

/* ---------- Navegação entre telas ---------- */
function mostra(id){
  document.querySelectorAll('.tela').forEach(t => t.classList.toggle('ativa', t.id === id));
}
$('#btnIniciar').addEventListener('click', () => { sfx('transition_cube'); mostra('pagina1'); });
if (location.hash === '#p1') mostra('pagina1');   // atalho de teste: index.html#p1
$('#btnHome').addEventListener('click', () => { audio.pause(); fechaSumario(); mostra('capa'); });

/* ---------- Áudio ---------- */
function carrega(nome, inicio = 0){
  indiceSeq = SEQUENCIA.indexOf(nome);
  disparados = new Set();
  audio.src = 'audio/' + nome + '.mp3';
  audio.dataset.nome = nome;
  audio.currentTime = 0;
  const cap = CAPITULOS.findIndex(c => c.audio === nome);
  if (cap >= 0) $('#capAtual').textContent = (cap+1) + ' · ' + CAPITULOS[cap].titulo;
  if (inicio > 0) audio.addEventListener('loadedmetadata', () => { audio.currentTime = inicio; marcaAte(inicio); }, {once:true});
  atualizaLista();
}
function toca(){
  $('#aguardando').classList.add('some');
  btnPlay.classList.remove('chama');
  audio.play().catch(() => {});
}

btnPlay.addEventListener('click', () => {
  if (!audio.src || audio.ended){
    // primeiro clique → dialogo0; depois que um termina → o próximo
    const prox = indiceSeq + 1;
    if (prox >= SEQUENCIA.length){ aviso('Fim do audiobook! 🎉'); return; }
    carrega(SEQUENCIA[prox]);
    toca();
  } else if (audio.paused){
    toca();
  } else {
    audio.pause();
  }
});

audio.addEventListener('play',  () => { pagina.classList.add('tocando'); pagina.classList.remove('pausado'); btnPlay.setAttribute('aria-label','Pausar narração'); roda('inicio'); });
audio.addEventListener('pause', () => { pagina.classList.remove('tocando'); pagina.classList.add('pausado'); btnPlay.setAttribute('aria-label','Tocar narração'); });
audio.addEventListener('ended', () => {
  roda('fim');
  btnPlay.classList.add('chama');
});
audio.addEventListener('error', () => {
  pagina.classList.remove('tocando');
  aviso(`Áudio "${audio.dataset.nome}.mp3" ainda não está na pasta audio/.`);
  $('#aguardando').classList.remove('some');
});
audio.addEventListener('timeupdate', () => {
  const d = audio.duration || 0;
  $('#barra').style.width = d ? (audio.currentTime / d * 100) + '%' : '0';
  const lista = EVENTOS[audio.dataset.nome] || [];
  lista.forEach((ev,i) => {
    if (typeof ev.t === 'number' && !disparados.has(i) && audio.currentTime >= ev.t){
      disparados.add(i);
      try { ev.acao(); } catch(e){ console.error(e); }
    }
  });
});
// ao pular para um ponto, eventos anteriores contam como já disparados
function marcaAte(t){
  (EVENTOS[audio.dataset.nome] || []).forEach((ev,i) => { if (typeof ev.t === 'number' && ev.t < t) disparados.add(i); });
}
function roda(gancho){
  (EVENTOS[audio.dataset.nome] || []).forEach((ev,i) => {
    if (ev.t === gancho && !disparados.has(gancho+i)){ disparados.add(gancho+i); try{ ev.acao(); }catch(e){ console.error(e); } }
  });
}

/* ---------- Sumário ---------- */
const CORES = ['var(--s)','var(--p)','var(--d)','var(--f)'];
function montaLista(){
  $('#lista').innerHTML = CAPITULOS.map((c,i) => `
    <li><button data-i="${i}">
      <span class="num" style="--c:${CORES[i % 4]}">${i+1}</span>
      <span class="txt"><b>${c.titulo}</b><span>${c.audio}${c.inicio ? ' · ' + formata(c.inicio) : ''}</span></span>
    </button></li>`).join('');
}
function atualizaLista(){
  document.querySelectorAll('#lista button').forEach(b => {
    const c = CAPITULOS[b.dataset.i];
    b.classList.toggle('atual', c.audio === audio.dataset.nome);
  });
}
const formata = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
montaLista();

function abreSumario(){ $('#veu').classList.add('aberto'); $('#folha').classList.add('aberta'); sfx('flip'); }
function fechaSumario(){ $('#veu').classList.remove('aberto'); $('#folha').classList.remove('aberta'); }
$('#btnSumario').addEventListener('click', abreSumario);
$('#btnFechar').addEventListener('click', fechaSumario);
$('#veu').addEventListener('click', fechaSumario);
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechaSumario(); });
$('#lista').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = CAPITULOS[b.dataset.i];
  fechaSumario();
  mostra('pagina1');
  carrega(c.audio, c.inicio);
  toca();
});

/* ---------- Aviso ---------- */
let tAviso;
function aviso(msg){
  const el = $('#aviso'); el.textContent = msg; el.classList.add('mostra');
  clearTimeout(tAviso); tAviso = setTimeout(() => el.classList.remove('mostra'), 3200);
}

/* ---------- PWA: funciona offline e pode ser instalado ---------- */
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
